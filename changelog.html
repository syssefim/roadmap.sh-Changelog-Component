<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog Component</title>
    <link rel="stylesheet" href="changelog.css">
</head>

<body>

    <main class="changelog">

        <header class="changelog-header">
            <h1>Changelog</h1>
            <p>Here's everything we have shipped in the past few days</p>
        </header>

        <div class="changes">

            <div class="change">
                <p class="date">September 3, 2024</p>
                <p class="description">Announcing Projects on Frontend Roadmap</p>
            </div>

            <div class="change">
                <p class="date">August 28, 2024</p>
                <p class="description">Build your learning habits with learning streaks</p>
            </div>

            

        </div>

    </main>

</body>
</html>
